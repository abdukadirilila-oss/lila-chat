<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LILA PRO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#111b21;height:100vh;overflow:hidden;font-family:sans-serif}
#login{position:fixed;inset:0;background:#111b21;z-index:1000;display:flex;align-items:center;justify-content:center}
.login-box{background:#202c33;padding:25px;border-radius:12px;width:90%;max-width:350px;color:#fff}
.login-box input{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:none;background:#2a3942;color:#fff}
.login-box button{width:100%;padding:12px;background:#00a884;border:none;border-radius:8px;color:#fff;font-weight:bold}
#app{display:flex;height:100vh}
.sidebar{width:35%;min-width:300px;background:#111b21;border-right:1px solid #222d34;display:flex;flex-direction:column}
.s-head{background:#202c33;padding:12px;color:#fff;display:flex;justify-content:space-between}
.chat-item{padding:12px;display:flex;gap:10px;border-bottom:1px solid #1f2c34;color:#fff;cursor:pointer}
.avatar{width:45px;height:45px;border-radius:50%;background:#00a884;display:flex;align-items:center;justify-content:center;font-weight:bold}
.main{flex:1;display:flex;flex-direction:column;background:#0b141a}
.m-head{background:#202c33;padding:10px;display:flex;justify-content:space-between;color:#fff}
.msgs{flex:1;overflow-y:auto;padding:15px}
.bubble{max-width:70%;padding:8px 10px;margin:4px 0;border-radius:8px}
.me{background:#005c4b;color:#fff;margin-left:auto}.other{background:#202c33;color:#fff}
.input-bar{background:#202c33;padding:8px;display:flex;gap:8px}.input-bar input{flex:1;padding:10px;border-radius:20px;border:none;background:#2a3942;color:#fff}
#incomingModal{position:fixed;inset:0;background:#111b21;z-index:9999;display:none;align-items:center;justify-content:center;flex-direction:column;color:#fff}
.big-av{width:120px;height:120px;border-radius:50%;background:#00a884;display:flex;align-items:center;justify-content:center;font-size:50px;margin-bottom:15px}
#callScreen{position:fixed;inset:0;background:#000;z-index:10000;display:none;flex-direction:column}
#videoUI{flex:1;position:relative;width:100%;height:100%;background:#000}
#remoteVideo{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;background:#000}
#localVideo{position:absolute;bottom:100px;right:15px;width:110px;height:150px;border-radius:12px;border:2px solid #fff;object-fit:cover;z-index:10;background:#333}
.controls{position:absolute;bottom:0;left:0;right:0;padding:20px;display:flex;justify-content:center;gap:20px;z-index:20;background:linear-gradient(transparent, #000)}
.ctrl{width:50px;height:50px;border-radius:50%;border:none;font-size:20px}.hangup{background:#f15c6d;color:#fff;width:60px;height:60px}.gray{background:#3b4a54;color:#fff}
#voiceUI{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff}
@media(max-width:768px){.sidebar{width:100%;position:absolute;z-index:5;height:100%}.sidebar.hide{transform:translateX(-100%)}.main{width:100%}}
</style></head><body>
<div id="login"><div class="login-box"><h3 style="color:#00a884">LILA PRO</h3><input id="lName" placeholder="Jina"><input id="lPhone" placeholder="Namba"><button onclick="doLogin()">INGIA</button></div></div>
<div id="app"><div class="sidebar" id="sidebar"><div class="s-head"><b>LILA PRO</b><span>Online</span></div><div id="chatList"></div></div><div class="main"><div class="m-head"><div style="display:flex;gap:10px;align-items:center"><button onclick="showSidebar()" style="background:none;border:none;color:#fff;font-size:22px">‹</button><div class="avatar" id="topAv">?</div><div><div id="topName">Chagua mtu</div><div id="topStatus" style="font-size:12px;color:#8696a0">Online</div></div></div><div><button onclick="makeCall(false)" style="background:none;border:none;font-size:22px">📞</button><button onclick="makeCall(true)" style="background:none;border:none;font-size:22px">🎥</button></div></div><div class="msgs" id="msgs"></div><div class="input-bar"><input id="msgInput" placeholder="Andika..."><button onclick="sendMsg()" style="background:#00a884;border:none;width:40px;height:40px;border-radius:50%;color:#fff">➤</button></div></div></div>
<div id="incomingModal"><div class="big-av" id="incAv">K</div><h2 id="incName"></h2><p id="incType" style="color:#8696a0;margin:5px"></p><div style="display:flex;gap:30px;margin-top:25px"><button class="ctrl hangup" onclick="reject()">✕</button><button class="ctrl gray" style="background:#00a884;width:60px;height:60px" onclick="accept()">📞</button></div></div>
<div id="callScreen"><div id="voiceUI"><div class="big-av" id="callAv">K</div><h2 id="callName"></h2><p id="callStat" style="color:#8696a0">Inapiga...</p><p id="timer" style="color:#8696a0"></p></div><div id="videoUI" style="display:none"><video id="remoteVideo" autoplay playsinline></video><video id="localVideo" autoplay playsinline muted></video></div><div class="controls"><button class="ctrl gray" onclick="toggleMute()">🎤</button><button class="ctrl gray" id="bVoice" onclick="toVoice()">📹</button><button class="ctrl gray" id="bVideo" onclick="toVideo()" style="display:none">🎥</button><button class="ctrl hangup" onclick="end()">✕</button></div></div>
<script src="/socket.io/socket.io.js"></script>
<script>
let socket=io(),myId,curChat,pc,localStream,callWith,isVideo=false,tInt,sec=0,incOffer,incFrom,incIsVideo;
function doLogin(){let n=document.getElementById('lName').value.trim(),p=document.getElementById('lPhone').value.trim();if(!n||!p)return alert('Jaza');localStorage.setItem('lila_name',n);localStorage.setItem('lila_phone',p);socket.emit('join',{name:n,phone:p});document.getElementById('login').style.display='none';}
let sn=localStorage.getItem('lila_name'),sp=localStorage.getItem('lila_phone');if(sn&&sp){document.getElementById('lName').value=sn;document.getElementById('lPhone').value=sp;}
socket.on('myId',i=>myId=i);
socket.on('users',list=>{let c=document.getElementById('chatList');c.innerHTML='';list.filter(u=>u.id!==myId).forEach(u=>{let d=document.createElement('div');d.className='chat-item';d.innerHTML=`<div class="avatar">${u.name[0].toUpperCase()}</div><div><div>${u.name}</div><div style="font-size:12px;color:#8696a0">${u.online?'Online':'Offline'}</div></div>`;d.onclick=()=>openChat(u);c.appendChild(d);});});
function openChat(u){curChat=u.id;document.getElementById('topName').textContent=u.name;document.getElementById('topAv').textContent=u.name[0].toUpperCase();document.getElementById('msgs').innerHTML='';document.getElementById('sidebar').classList.add('hide');socket.emit('getMessages',u.id);}
function showSidebar(){document.getElementById('sidebar').classList.remove('hide');}
socket.on('chatHistory',d=>{if(d.withUser!==curChat)return;let b=document.getElementById('msgs');b.innerHTML='';d.msgs.forEach(m=>{let div=document.createElement('div');div.className='bubble '+(m.from===myId?'me':'other');div.textContent=m.text;b.appendChild(div);});});
socket.on('newMessage',m=>{let o=m.from===myId?m.to:m.from;if(o===curChat){let b=document.getElementById('msgs');let div=document.createElement('div');div.className='bubble '+(m.from===myId?'me':'other');div.textContent=m.text;b.appendChild(div);b.scrollTop=b.scrollHeight;}});
function sendMsg(){let i=document.getElementById('msgInput');if(!i.value.trim()||!curChat)return;socket.emit('sendMessage',{to:curChat,text:i.value});i.value='';}
let cfg={iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]};
async function mkPC(){if(pc)pc.close();pc=new RTCPeerConnection(cfg);pc.ontrack=e=>{console.log('REMOTE TRACK',e.streams[0]);let rv=document.getElementById('remoteVideo');rv.srcObject=e.streams[0];rv.play().catch(()=>{});};pc.onicecandidate=e=>{if(e.candidate&&callWith)socket.emit('ice-candidate',{to:callWith,candidate:e.candidate});};}
async function makeCall(v){if(!curChat)return alert('Chagua mtu');isVideo=v;callWith=curChat;try{await mkPC();localStream=await navigator.mediaDevices.getUserMedia({video:v,audio:true});document.getElementById('localVideo').srcObject=localStream;localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));let off=await pc.createOffer();await pc.setLocalDescription(off);socket.emit('call-user',{to:callWith,offer:off,isVideo:v});showCall(v,document.getElementById('topName').textContent);}catch(e){alert('Allow camera/mic: '+e.message);}}
function showCall(v,name){document.getElementById('callScreen').style.display='flex';document.getElementById('callName').textContent=name;document.getElementById('callAv').textContent=name[0].toUpperCase();if(v){document.getElementById('voiceUI').style.display='none';document.getElementById('videoUI').style.display='block';document.getElementById('bVoice').style.display='block';document.getElementById('bVideo').style.display='none';}else{document.getElementById('voiceUI').style.display='flex';document.getElementById('videoUI').style.display='none';document.getElementById('bVoice').style.display='none';document.getElementById('bVideo').style.display='block';}sec=0;clearInterval(tInt);tInt=setInterval(()=>{sec++;document.getElementById('timer').textContent=Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');},1000);}
socket.on('incoming-call',async d=>{incOffer=d.offer;incFrom=d.from;incIsVideo=d.isVideo;callWith=d.from;document.getElementById('incName').textContent=d.fromName;document.getElementById('incAv').textContent=d.fromName[0].toUpperCase();document.getElementById('incType').textContent=d.isVideo?'Video call...':'Voice call...';document.getElementById('incomingModal').style.display='flex';});
async function accept(){document.getElementById('incomingModal').style.display='none';isVideo=incIsVideo;try{await mkPC();await pc.setRemoteDescription(new RTCSessionDescription(incOffer));localStream=await navigator.mediaDevices.getUserMedia({video:isVideo,audio:true});document.getElementById('localVideo').srcObject=localStream;localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));let ans=await pc.createAnswer();await pc.setLocalDescription(ans);socket.emit('answer-call',{to:incFrom,answer:ans});showCall(isVideo,document.getElementById('incName').textContent);}catch(e){alert(e.message);}}
function reject(){document.getElementById('incomingModal').style.display='none';socket.emit('end-call',{to:incFrom});}
socket.on('call-answered',async d=>{await pc.setRemoteDescription(new RTCSessionDescription(d.answer));document.getElementById('callStat').textContent='Imeunganishwa';});
socket.on('ice-candidate',async c=>{try{await pc.addIceCandidate(new RTCIceCandidate(c));}catch{}});
socket.on('call-ended',()=>cleanup());
socket.on('switched-to-voice',()=>{document.getElementById('voiceUI').style.display='flex';document.getElementById('videoUI').style.display='none';document.getElementById('bVoice').style.display='none';document.getElementById('bVideo').style.display='block';});
socket.on('switched-to-video',async d=>{if(d.offer){await pc.setRemoteDescription(new RTCSessionDescription(d.offer));let a=await pc.createAnswer();await pc.setLocalDescription(a);socket.emit('answer-call',{to:callWith,answer:a});}document.getElementById('voiceUI').style.display='none';document.getElementById('videoUI').style.display='block';document.getElementById('bVoice').style.display='block';document.getElementById('bVideo').style.display='none';});
async function toVoice(){isVideo=false;if(localStream)localStream.getVideoTracks().forEach(t=>t.stop());document.getElementById('voiceUI').style.display='flex';document.getElementById('videoUI').style.display='none';document.getElementById('bVoice').style.display='none';document.getElementById('bVideo').style.display='block';socket.emit('switch-to-voice',{to:callWith});}
async function toVideo(){try{let vs=await navigator.mediaDevices.getUserMedia({video:true});let vt=vs.getVideoTracks()[0];localStream.addTrack(vt);let s=pc.getSenders().find(x=>x.track&&x.track.kind==='video');if(s)s.replaceTrack(vt);else pc.addTrack(vt,localStream);document.getElementById('localVideo').srcObject=localStream;document.getElementById('voiceUI').style.display='none';document.getElementById('videoUI').style.display='block';document.getElementById('bVoice').style.display='block';document.getElementById('bVideo').style.display='none';let off=await pc.createOffer();await pc.setLocalDescription(off);socket.emit('switch-to-video',{to:callWith,offer:off});isVideo=true;}catch(e){alert(e.message);}}
function toggleMute(){if(!localStream)return;localStream.getAudioTracks().forEach(t=>t.enabled=!t.enabled);}
function end(){if(callWith)socket.emit('end-call',{to:callWith});cleanup();}
function cleanup(){clearInterval(tInt);document.getElementById('callScreen').style.display='none';document.getElementById('incomingModal').style.display='none';if(localStream)localStream.getTracks().forEach(t=>t.stop());if(pc)pc.close();pc=null;localStream=null;callWith=null;document.getElementById('remoteVideo').srcObject=null;document.getElementById('localVideo').srcObject=null;}
</script></body></html>
