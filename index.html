<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>LILA PRO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;}
body{background:#111b21;height:100vh;overflow:hidden;display:flex;flex-direction:column}
#app{display:flex;height:100vh;width:100vw}

/* SIDEBAR KAMA WHATSAPP */
.sidebar{width:35%;max-width:420px;min-width:300px;background:#111b21;border-right:1px solid #222d34;display:flex;flex-direction:column}
.side-head{background:#202c33;padding:15px;display:flex;justify-content:space-between;align-items:center;color:#e9edef}
.chat-item{padding:12px 15px;display:flex;gap:12px;border-bottom:1px solid #222d34;color:#e9edef;cursor:pointer}
.chat-item:hover{background:#202c33}
.chat-item.active{background:#2a3942}
.avatar{width:49px;height:49px;border-radius:50%;background:#00a884;display:flex;align-items:center;justify-content:center;font-weight:bold;color:white}

/* CHAT AREA */
.main{flex:1;display:flex;flex-direction:column;background:#0b141a;position:relative}
.main-head{background:#202c33;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;color:white}
.msgs{flex:1;overflow-y:auto;padding:20px;background:#0b141a;background-image:url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');background-repeat:repeat;opacity:1}
.bubble{max-width:65%;padding:8px 10px;margin:5px;border-radius:7.5px;font-size:14.2px;position:relative}
.me{background:#005c4b;color:#e9edef;margin-left:auto;border-top-right-radius:0}
.other{background:#202c33;color:#e9edef;border-top-left-radius:0}
.input-bar{background:#202c33;padding:5px 10px;display:flex;align-items:center;gap:10px}
.input-bar input{flex:1;background:#2a3942;border:none;padding:12px 15px;border-radius:21px;color:white;outline:none}
.btn{width:45px;height:45px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center}
.send{background:#00a884;color:white}

/* CALL SCREEN WHATSAPP STYLE */
#callScreen{position:fixed;inset:0;background:#0b141a;z-index:999;display:none;flex-direction:column}
.voice-ui{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:white}
.call-avatar{width:120px;height:120px;border-radius:50%;background:#00a884;display:flex;align-items:center;justify-content:center;font-size:50px;margin-bottom:20px}

/* VIDEO WHATSAPP STYLE - REMOTE FULL, LOCAL SMALL PIP */
.video-ui{flex:1;position:relative;background:black;overflow:hidden}
#remoteVideo{width:100%;height:100%;object-fit:cover}
#localVideo{position:absolute;bottom:100px;right:20px;width:120px;height:160px;border-radius:12px;object-fit:cover;border:2px solid rgba(255,255,255,0.3);z-index:10;box-shadow:0 4px 20px rgba(0,0,0,0.5)}

.call-controls{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent, rgba(0,0,0,0.8));padding:20px;display:flex;justify-content:center;gap:20px;align-items:center}
.ctrl{width:50px;height:50px;border-radius:50%;border:none;cursor:pointer}
.hangup{background:#f15c6d;width:60px;height:60px}
.switch{background:#3b4a54;color:white}
.mute{background:#3b4a54;color:white}

@media(max-width:768px){
.sidebar{width:100%;max-width:100%;position:absolute;z-index:5;height:100%}
.sidebar.hidden{transform:translateX(-100%)}
.main{width:100%}
#localVideo{width:90px;height:120px;bottom:90px;right:15px}
.bubble{max-width:85%}
}
</style>
</head>
<body>
<div id="app">
<div class="sidebar" id="sidebar">
<div class="side-head"><b>LILA PRO</b><span style="color:#00a884;font-size:12px">● Imehifadhiwa</span></div>
<div id="chatList"></div>
</div>
<div class="main">
<div class="main-head">
<div style="display:flex;align-items:center;gap:10px"><button onclick="showSidebar()" style="background:none;border:none;color:white;font-size:20px" id="backBtn">←</button><div class="avatar" id="chatAvatar">M</div><div><div id="chatName">Chagua mtu</div><div style="font-size:12px;color:#8696a0" id="chatStatus">uanze chat</div></div></div>
<div style="display:flex;gap:15px">
<button onclick="startVoiceCall()" style="background:none;border:none;color:#aebac1;font-size:22px">📞</button>
<button onclick="startVideoCall()" style="background:none;border:none;color:#aebac1;font-size:22px">📹</button>
</div>
</div>
<div class="msgs" id="msgs"></div>
<div class="input-bar">
<button class="btn" style="background:#2a3942;color:#8696a0">📎</button>
<input id="msgInput" placeholder="Andika ujumbe...">
<button class="btn send" onclick="sendMsg()">➤</button>
</div>
</div>
</div>

<!-- CALL SCREEN -->
<div id="callScreen">
<!-- VOICE CALL UI -->
<div id="voiceUI" class="voice-ui">
<div class="call-avatar" id="callAvatarBig">K</div>
<h2 id="callName">kadiri</h2>
<p id="callTimer" style="color:#8696a0;margin-top:10px">Inapiga...</p>
</div>

<!-- VIDEO CALL UI -->
<div id="videoUI" class="video-ui" style="display:none">
<video id="remoteVideo" autoplay playsinline></video>
<video id="localVideo" autoplay playsinline muted></video>
</div>

<!-- CONTROLS KAMA WHATSAPP -->
<div class="call-controls">
<button class="ctrl mute" onclick="toggleMute()" id="muteBtn">🎤</button>
<button class="ctrl switch" onclick="switchToVoice()" id="toVoiceBtn" title="Zima kamera">📹</button>
<button class="ctrl switch" onclick="switchToVideo()" id="toVideoBtn" title="Washa kamera" style="display:none">🎥</button>
<button class="ctrl hangup" onclick="endCall()">✕</button>
<button class="ctrl mute" onclick="toggleSpeaker()">🔊</button>
</div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
let currentChat = null;
let isVideoCall = false;

// ... weka logic yako ya zamani ya socket hapa, nimebadilisha UI tu ...

function startVideoCall(){ isVideoCall=true; document.getElementById('callScreen').style.display='flex'; document.getElementById('voiceUI').style.display='none'; document.getElementById('videoUI').style.display='block'; document.getElementById('toVoiceBtn').style.display='flex'; document.getElementById('toVideoBtn').style.display='none'; // weka logic yako ya WebRTC hapa }
function startVoiceCall(){ isVideoCall=false; document.getElementById('callScreen').style.display='flex'; document.getElementById('voiceUI').style.display='flex'; document.getElementById('videoUI').style.display='none'; document.getElementById('toVoiceBtn').style.display='none'; document.getElementById('toVideoBtn').style.display='flex'; }
function switchToVoice(){ document.getElementById('voiceUI').style.display='flex'; document.getElementById('videoUI').style.display='none'; document.getElementById('toVoiceBtn').style.display='none'; document.getElementById('toVideoBtn').style.display='flex'; isVideoCall=false; // zima kamera }
function switchToVideo(){ document.getElementById('voiceUI').style.display='none'; document.getElementById('videoUI').style.display='block'; document.getElementById('toVoiceBtn').style.display='flex'; document.getElementById('toVideoBtn').style.display='none'; isVideoCall=true; // washa kamera }
function endCall(){ document.getElementById('callScreen').style.display='none'; }
function showSidebar(){ document.getElementById('sidebar').classList.remove('hidden'); }
</script>
</body>
</html>
