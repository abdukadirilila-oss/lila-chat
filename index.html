<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LILA CHAT PRO</title>
<script src="/socket.io/socket.io.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',Arial}
body{display:flex;height:100vh;background:#0a1014}
#sidebar{width:32%;background:#111b21;border-right:1px solid #222d34;color:white;display:flex;flex-direction:column}
#chat{width:68%;background:#0b141a;display:flex;flex-direction:column;position:relative}
.header{padding:16px;background:#202c33;color:white;font-weight:600;display:flex;align-items:center;justify-content:space-between}
.logo{color:#00a884;font-size:20px}
#users{flex:1;overflow:auto;padding:10px}
.user{padding:12px;background:#202c33;margin:6px 0;border-radius:10px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:0.2s}
.user:hover{background:#2a3942;transform:scale(1.02)}
.user.phone{font-size:11px;color:#8696a0}
#messages{flex:1;overflow-y:auto;padding:20px;background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');}
.msg{padding:10px 14px;border-radius:12px;margin:8px 0;max-width:70%;color:white;position:relative;box-shadow:0 1px 2px rgba(0,0,0,0.3)}
.me{background:#005c4b;margin-left:auto;border-bottom-right-radius:2px}
.other{background:#202c33;border-bottom-left-radius:2px}
.msg.meta{font-size:10px;color:#8696a0;margin-top:4px;display:flex;justify-content:space-between}
.msg img{max-width:220px;border-radius:8px;margin-top:6px}
.deleteBtn{position:absolute;top:-8px;right:-8px;background:red;color:white;border:none;border-radius:50%;width:20px;height:20px;cursor:pointer;display:none;font-size:12px}
.msg:hover.deleteBtn{display:block}
#inputArea{display:flex;padding:12px;background:#202c33;align-items:center;gap:8px}
#msgInput{flex:1;padding:13px 18px;border-radius:25px;border:none;outline:none;background:#2a3942;color:white}
button{padding:11px 16px;border:none;border-radius:20px;background:#00a884;color:white;cursor:pointer;font-weight:600}
#videoBox{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:9999;display:none;flex-direction:column}
#videos{display:flex;flex:1} video{width:50%;height:100%;object-fit:cover}
#loginBox{position:fixed;top:0;left:0;width:100%;height:100%;background:#111b21;z-index:10000;display:flex;align-items:center;justify-content:center}
.loginCard{background:#202c33;padding:35px;border-radius:16px;width:90%;max-width:380px;text-align:center;color:white}
.loginCard input{width:100%;padding:14px;margin:10px 0;border-radius:10px;border:none;outline:none;background:#2a3942;color:white;font-size:16px}
.loginCard button{width:100%;padding:14px;background:#00a884;border-radius:10px;font-size:16px;margin-top:10px}
#callPopup{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#202c33;padding:30px;border-radius:16px;z-index:10001;display:none;text-align:center;color:white;min-width:300px}
</style>
</head>
<body>
<div id="loginBox">
<div class="loginCard">
<h2 style="color:#00a884">🔥 LILA CHAT PRO</h2>
<p style="color:#8696a0;margin:10px 0">Ingiza namba itakayounganishwa</p>
<input id="loginName" placeholder="Jina lako (mf: Juma)">
<input id="loginPhone" placeholder="Namba ya simu (mf: 0712345678)" type="tel">
<button onclick="doLogin()">Ingia Kwenye System ✅</button>
<p style="font-size:11px;color:#8696a0;margin-top:15px">Namba yako itahifadhiwa na itaunganishwa na meseji</p>
</div>
</div>

<div id="sidebar"><div class="header"><span class="logo">LILA 💬 PRO</span><span id="myName" style="font-size:13px"></span></div><div id="users"></div></div>
<div id="chat"><div class="header"><span id="chatHeader">Chagua mtu uanze chat</span><span style="font-size:11px;color:#00ff9d">● Imehifadhiwa</span></div><div id="messages"></div><div id="inputArea"><label for="fileInput" style="background:#2a3942;padding:11px 14px;border-radius:50%;cursor:pointer">📎</label><input type="file" id="fileInput" hidden onchange="sendFile(this)"><input id="msgInput" placeholder="Andika ujumbe..." onkeydown="if(event.key==='Enter')sendMsg()"><button onclick="sendMsg()">➤</button></div></div>
<div id="callPopup"><h3 id="popupText"></h3><br><button onclick="acceptCall()" style="background:#00a884">Kubali ✅</button><button onclick="rejectCall()" style="background:red">Kataa ❌</button></div>
<div id="videoBox"><div id="videos"><video id="localVideo" autoplay muted playsinline></video><video id="remoteVideo" autoplay playsinline></video></div><div style="padding:20px;text-align:center;background:#202c33"><button onclick="endCall()" style="background:red;padding:15px 30px;border-radius:50px">Kata Simu ❌</button></div></div>

<script>
const socket=io();
let myData=null, localStream=null, pc=null, currentCallTo=null, pendingCall=null;
const rtcConfig={iceServers:[{urls:"stun:stun.l.google.com:19302"}]};

function doLogin(){
 const name=document.getElementById('loginName').value.trim();
 const phone=document.getElementById('loginPhone').value.trim();
 if(!name ||!phone){alert('Jaza jina na namba!');return}
 myData={name, phone};
 document.getElementById('loginBox').style.display='none';
 document.getElementById('myName').innerText=name+' | '+phone;
 socket.emit('join', myData);
}

async function createPeerConnection(toId){pc=new RTCPeerConnection(rtcConfig);pc.onicecandidate=e=>{if(e.candidate)socket.emit('ice_candidate',{to:toId,candidate:e.candidate})};pc.ontrack=e=>{document.getElementById('remoteVideo').srcObject=e.streams[0]};if(localStream)localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));return pc}
async function getMedia(type){try{localStream=await navigator.mediaDevices.getUserMedia({video:type==='video',audio:true});document.getElementById('localVideo').srcObject=localStream;return true}catch(e){alert(e.message);return false}}

function sendMsg(){const text=document.getElementById('msgInput').value.trim();if(!text)return;const data={name:myData.name,phone:myData.phone,text,time:new Date().toLocaleTimeString(), id:Date.now().toString()};socket.emit('send_message',data);document.getElementById('msgInput').value=''}
function addMessage(data,isFile){
 const isMe=data.phone===myData.phone || data.name===myData.name;
 const div=document.createElement('div');div.className='msg '+(isMe?'me':'other');div.id='msg-'+data.id;
 let content=isFile?`<a href="${data.url}" download="${data.fileName}" style="color:#53bdeb">📄 ${data.fileName}</a>${data.isImage?`<br><img src="${data.url}">`:''}`:`${data.text}`;
 div.innerHTML=`<button class="deleteBtn" onclick="deleteMsg('${data.id}')">×</button><b>${data.name}</b> <small style="color:#8696a0">${data.phone||''}</small><br>${content}<div class="meta"><span>${data.time}</span><span>${isMe?'✓✓':''}</span></div>`;
 document.getElementById('messages').appendChild(div);document.getElementById('messages').scrollTop=999999;
}
function deleteMsg(id){if(confirm('Futa meseji hii?'))socket.emit('delete_message',id)}
function sendFile(input){const file=input.files[0];if(!file)return;const reader=new FileReader();reader.onload=e=>{const data={name:myData.name,phone:myData.phone,fileName:file.name,size:file.size,url:e.target.result,isImage:file.type.startsWith('image/'),time:new Date().toLocaleTimeString(),id:Date.now().toString()};socket.emit('send_file',data)};reader.readAsDataURL(file)}

socket.on('load_old_messages',msgs=>{document.getElementById('messages').innerHTML='';msgs.forEach(m=>addMessage(m, m.type==='file'))});
socket.on('receive_message',data=>addMessage(data,false));
socket.on('receive_file',data=>addMessage(data,true));
socket.on('message_deleted',id=>{const el=document.getElementById('msg-'+id);if(el)el.remove()});
socket.on('online_list',users=>{const div=document.getElementById('users');div.innerHTML='';users.filter(u=>u.id!==socket.id).forEach(u=>{const el=document.createElement('div');el.className='user';el.innerHTML=`<div><div>👤 ${u.name}</div><div class="phone">${u.phone}</div></div><div><button onclick="startCall('${u.id}','video')">📹</button><button onclick="startCall('${u.id}','audio')">📞</button></div>`;div.appendChild(el)})});
async function startCall(toId,type){const ok=await getMedia(type);if(!ok)return;document.getElementById('videoBox').style.display='flex';await createPeerConnection(toId);const offer=await pc.createOffer();await pc.setLocalDescription(offer);socket.emit('call_user',{to:toId,offer,type});currentCallTo=toId}
socket.on('incoming_call',async(data)=>{pendingCall=data;document.getElementById('popupText').innerText=`📞 ${data.fromName} anakupigia`;document.getElementById('callPopup').style.display='block'});
async function acceptCall(){document.getElementById('callPopup').style.display='none';const {from,offer,type}=pendingCall;const ok=await getMedia(type);if(!ok)return;document.getElementById('videoBox').style.display='flex';await createPeerConnection(from);await pc.setRemoteDescription(new RTCSessionDescription(offer));const answer=await pc.createAnswer();await pc.setLocalDescription(answer);socket.emit('answer_call',{to:from,answer});currentCallTo=from}
function rejectCall(){document.getElementById('callPopup').style.display='none';socket.emit('end_call',{to:pendingCall.from})}
socket.on('call_answered',async({answer})=>{await pc.setRemoteDescription(new RTCSessionDescription(answer))});
socket.on('ice_candidate',async({candidate})=>{try{await pc.addIceCandidate(new RTCIceCandidate(candidate))}catch(e){}});
socket.on('call_ended',()=>endCall());
function endCall(){if(pc){pc.close();pc=null}if(localStream){localStream.getTracks().forEach(t=>t.stop());localStream=null}document.getElementById('videoBox').style.display='none';document.getElementById('callPopup').style.display='none';if(currentCallTo){socket.emit('end_call',{to:currentCallTo});currentCallTo=null}}
</script>
</body>
</html>
