<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LILA PRO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#111b21;height:100dvh;overflow:hidden}
#login{position:fixed;inset:0;background:#111b21;z-index:1000;display:flex;align-items:center;justify-content:center}
.login-box{background:#202c33;padding:22px;border-radius:12px;width:90%;max-width:340px;color:#fff}
.login-box input{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:none;background:#2a3942;color:#fff}
.login-box button{width:100%;padding:12px;background:#00a884;border:none;border-radius:8px;color:#fff;font-weight:bold}
#app{display:flex;height:100dvh}
.sidebar{width:35%;min-width:300px;background:#111b21;border-right:1px solid #222d34;display:flex;flex-direction:column}
.s-head{background:#202c33;padding:12px;color:#fff;display:flex;justify-content:space-between}
.chat-item{padding:11px;display:flex;gap:10px;border-bottom:1px solid #1f2c34;color:#fff;cursor:pointer}
.avatar{width:42px;height:42px;border-radius:50%;background:#00a884;display:flex;align-items:center;justify-content:center;font-weight:bold}
.main{flex:1;display:flex;flex-direction:column;background:#0b141a}
.m-head{background:#202c33;padding:8px 12px;display:flex;justify-content:space-between;color:#fff}
.msgs{flex:1;overflow-y:auto;padding:12px}
.bubble{max-width:75%;padding:7px 9px;margin:3px 0;border-radius:8px;font-size:14px;word-break:break-word}
.me{background:#005c4b;color:#fff;margin-left:auto}.other{background:#202c33;color:#fff}
.input-bar{background:#202c33;padding:5px 6px;display:flex;gap:4px;align-items:center}
.input-bar input{flex:1;padding:10px 12px;border-radius:20px;border:none;background:#2a3942;color:#fff;outline:none}
.i-btn{background:#2a3942;border:none;min-width:36px;height:36px;border-radius:50%;color:#8696a0;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.i-btn.send{background:#00a884;color:#fff}
#callScreen{position:fixed;inset:0;background:#121212;z-index:9999;display:none;flex-direction:column}
#voiceUI{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff}
.big-av{width:110px;height:110px;border-radius:50%;background:#00a884;display:flex;align-items:center;justify-content:center;font-size:44px;margin-bottom:12px}
#videoUI{flex:1;position:relative;width:100%;height:100%;background:#000;display:flex;align-items:center;justify-content:center}
#remoteVideo{width:100%;height:100%;object-fit:contain;background:#000;position:absolute;inset:0} /* FIX ZOOM - contain sio cover */
#localVideo{position:absolute;bottom:90px;right:12px;width:100px;height:140px;border-radius:10px;object-fit:contain;border:2px solid #fff;z-index:10;background:#222}
.controls{position:absolute;bottom:0;left:0;right:0;padding:16px;display:flex;justify-content:center;gap:14px;z-index:30;background:linear-gradient(transparent,rgba(0,0,0,0.8))}
.ctrl{width:48px;height:48px;border-radius:50%;border:none;font-size:18px}.hangup{background:#f15c6d;color:#fff;width:56px;height:56px}.gray{background:#3b4a54;color:#fff}
#incomingModal{position:fixed;inset:0;background:#111b21;z-index:10000;display:none;align-items:center;justify-content:center;flex-direction:column;color:#fff}
#shareBar{position:absolute;bottom:50px;left:6px;right:6px;background:#233138;padding:8px;border-radius:12px;display:none;z-index:40;gap:6px;flex-wrap:wrap}
#shareBar button{background:#2a3942;border:none;color:#fff;padding:8px 10px;border-radius:18px;font-size:13px;cursor:pointer}
@media(max-width:768px){.sidebar{width:100%;position:absolute;z-index:5;height:100%}.sidebar.hide{transform:translateX(-100%)}.main{width:100%}}
</style></head>
<body>
<div id="login"><div class="login-box"><h3 style="color:#00a884">LILA PRO</h3><input id="lName" placeholder="Jina"><input id="lPhone" placeholder="Namba"><button onclick="doLogin()">INGIA</button></div></div>
<div id="app"><div class="sidebar" id="sidebar"><div class="s-head"><b>LILA PRO</b><span style="font-size:10px;background:#00a884;padding:2px 6px;border-radius:8px">ON</span></div><div id="chatList"></div></div><div class="main"><div class="m-head"><div style="display:flex;gap:8px;align-items:center"><button onclick="showSidebar()" style="background:none;border:none;color:#fff;font-size:20px">‹</button><div class="avatar" id="topAv">?</div><div><div id="topName">Chagua mtu</div><div id="topStatus" style="font-size:11px;color:#8696a0">Online</div></div></div><div><button onclick="makeCall(false)" style="background:none;border:none;font-size:20px">📞</button><button onclick="makeCall(true)" style="background:none;border:none;font-size:20px">🎥</button></div></div><div class="msgs" id="msgs"></div>
<div id="shareBar"><button onclick="pickFile('image/*')">🖼️ Picha</button><button onclick="pickFile('video/*')">🎥 Video</button><button onclick="pickFile('audio/*')">🎵 Music</button><button onclick="pickFile('*/*')">📄 File</button><button onclick="shareLoc()">📍 Location</button></div>
<div class="input-bar"><button class="i-btn" onclick="toggleShare()">📎</button><input id="msgInput" placeholder="Andika..." onkeydown="if(event.key==='Enter')sendMsg()"><button class="i-btn send" onclick="sendMsg()">➤</button></div>
<input type="file" id="fileIn" hidden>
</div></div>
<div id="incomingModal"><div class="big-av" id="incAv">K</div><h2 id="incName"></h2><p id="incType" style="color:#8696a0"></p><div style="display:flex;gap:24px;margin-top:20px"><button class="ctrl hangup" onclick="reject()">✕</button><button class="ctrl gray" style="background:#00a884;width:56px;height:56px" onclick="accept()">📞</button></div></div>
<div id="callScreen"><div id="voiceUI"><div class="big-av" id="callAv">K</div><h2 id="callName"></h2><p id="callStat" style="color:#8696a0">Inapiga...</p><p id="timer" style="color:#8696a0"></p></div><div id="videoUI" style="display:none"><video id="remoteVideo" autoplay playsinline></video><video id="localVideo" autoplay playsinline muted></video><audio id="remoteAudio" autoplay></audio></div><div class="controls"><button class="ctrl gray" id="muteBtn" onclick="toggleMute()">🎤</button><button class="ctrl hangup" onclick="end()">✕</button><button class="ctrl gray" onclick="switchCam()">🔄</button></div></div>
<script src="/socket.io/socket.io.js"></script>
<script>
const socket=io(); let myId,curChat,pc,localStream,callWith,isVideo=false,tInt,sec=0,incOffer,incFrom,incIsVideo,curCam="user";
function doLogin(){let n=document.getElementById('lName').value.trim(),p=document.getElementById('lPhone').value.trim();if(!n||!p)return alert('Jaza');localStorage.setItem('lila_name',n);localStorage.setItem('lila_phone',p);socket.emit('join',{name:n,phone:p});document.getElementById('login').style.display='none';}
let sn=localStorage.getItem('lila_name'),sp=localStorage.getItem('lila_phone');if(sn&&sp){document.getElementById('lName').value=sn;document.getElementById('lPhone').value=sp;}
socket.on('myId',i=>myId=i);
socket.on('users',list=>{let c=document.getElementById('chatList');c.innerHTML='';list.filter(u=>u.id!==myId).forEach(u=>{let d=document.createElement('div');d.className='chat-item';d.innerHTML=`<div class="avatar">${u.name[0].toUpperCase()}</div><div><div style="font-size:14px">${u.name}</div><div style="font-size:11px;color:#8696a0">${u.online?'● Online':'Offline'}</div></div>`;d.onclick=()=>openChat(u);c.appendChild(d);});});
function openChat(u){curChat=u.id;document.getElementById('topName').textContent=u.name;document.getElementById('topAv').textContent=u.name[0].toUpperCase();document.getElementById('msgs').innerHTML='';document.getElementById('sidebar').classList.add('hide');socket.emit('getMessages',u.id);}
function showSidebar(){document.getElementById('sidebar').classList.remove('hide');}
socket.on('chatHistory',d=>{if(d.withUser!==curChat)return;let b=document.getElementById('msgs');b.innerHTML='';d.msgs.slice(-50).forEach(addBubble);});
socket.on('newMessage',m=>{let o=m.from===myId?m.to:m.from;if(o===curChat)addBubble(m);});
function addBubble(m){let b=document.getElementById('msgs');let div=document.createElement('div');div.className='bubble '+(m.from===myId?'me':'other');
if(m.type==='image') div.innerHTML=`<img src="${m.text}" style="max-width:180px;border-radius:8px;display:block" loading="lazy">`;
else if(m.type==='video') div.innerHTML=`<video src="${m.text}" controls style="max-width:200px;border-radius:8px"></video>`;
else if(m.type==='audio') div.innerHTML=`🎵 <audio src="${m.text}" controls style="max-width:180px"></audio><br><small>${m.caption||''}</small>`;
else if(m.type==='file') div.innerHTML=`📄 <a href="${m.text}" download="${m.caption||'file'}" style="color:#53bdeb">${m.caption||'File'}</a>`;
else if(m.type==='location') div.innerHTML=`📍 <a href="${m.text}" target="_blank" style="color:#fff">Fungua Location</a>`;
else div.textContent=m.text;
b.appendChild(div); b.scrollTop=b.scrollHeight;
}
function sendMsg(){let i=document.getElementById('msgInput');if(!i.value.trim()||!curChat)return;socket.emit('sendMessage',{to:curChat,text:i.value,type:'text'});i.value='';}
// SHARING - NYEPESI
function toggleShare(){let s=document.getElementById('shareBar');s.style.display=s.style.display==='flex'?'none':'flex';}
function pickFile(accept){let inp=document.getElementById('fileIn'); inp.accept=accept; inp.click(); toggleShare();}
function shareLoc(){toggleShare(); if(!curChat)return; navigator.geolocation.getCurrentPosition(p=>{let url=`https://maps.google.com/?q=${p.coords.latitude},${p.coords.longitude}`; socket.emit('sendMessage',{to:curChat,text:url,type:'location'});});}
document.getElementById('fileIn').addEventListener('change',function(){if(!this.files[0]||!curChat)return;let f=this.files[0]; if(f.size>8*1024*1024) return alert('File kubwa sana, max 8MB'); let r=new FileReader(); r.onload=e=>{
let t='file'; if(f.type.startsWith('image/')) t='image'; else if(f.type.startsWith('video/')) t='video'; else if(f.type.startsWith('audio/')) t='audio';
socket.emit('sendMessage',{to:curChat,text:e.target.result,type:t,caption:f.name});
}; r.readAsDataURL(f); this.value='';});
// CALL - HAINA MWANGWI, HARAKA
let cfg={iceServers:[{urls:'stun:stun.l.google.com:19302'}]};
async function getMedia(v){return await navigator.mediaDevices.getUserMedia({video: v? {width:{ideal:320},height:{ideal:240},facingMode:curCam}:false, audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}}).catch(()=>navigator.mediaDevices.getUserMedia({video: v? true:false, audio:true}));}
async function mkPC(){
if(pc) pc.close(); pc=new RTCPeerConnection(cfg);
pc.ontrack=e=>{
let rv=document.getElementById('remoteVideo'); let ra=document.getElementById('remoteAudio');
if(e.track.kind==='video'){rv.srcObject=e.streams[0]; rv.play().catch(()=>{});}
if(e.track.kind==='audio'){ra.srcObject=e.streams[0]; ra.volume=0.9; ra.play().catch(()=>{document.body.addEventListener('click',()=>ra.play(),{once:true});});}
};
pc.onicecandidate=e=>{if(e.candidate&&callWith)socket.emit('ice-candidate',{to:callWith,candidate:e.candidate});};
}
async function makeCall(v){if(!curChat)return alert('Chagua mtu');isVideo=v;callWith=curChat;curCam="user";try{await mkPC();localStream=await getMedia(v);document.getElementById('localVideo').srcObject=localStream;localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));let o=await pc.createOffer();await pc.setLocalDescription(o);socket.emit('call-user',{to:callWith,offer:o,isVideo:v});showCall(v,document.getElementById('topName').textContent);}catch(e){alert(e.message);}}
function showCall(v,name){document.getElementById('callScreen').style.display='flex';document.getElementById('callName').textContent=name;document.getElementById('callAv').textContent=name[0].toUpperCase();document.getElementById('callStat').textContent=v?'Video...':'Voice...';document.getElementById('voiceUI').style.display=v?'none':'flex';document.getElementById('videoUI').style.display=v?'flex':'none';sec=0;clearInterval(tInt);tInt=setInterval(()=>{sec++;document.getElementById('timer').textContent=Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');},1000);}
socket.on('incoming-call',d=>{incOffer=d.offer;incFrom=d.from;incIsVideo=d.isVideo;callWith=d.from;document.getElementById('incName').textContent=d.fromName;document.getElementById('incAv').textContent=d.fromName[0].toUpperCase();document.getElementById('incType').textContent=d.isVideo?'Video...':'Voice...';document.getElementById('incomingModal').style.display='flex';});
async function accept(){document.getElementById('incomingModal').style.display='none';isVideo=incIsVideo;try{await mkPC();await pc.setRemoteDescription(new RTCSessionDescription(incOffer));localStream=await getMedia(isVideo);document.getElementById('localVideo').srcObject=localStream;localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));let a=await pc.createAnswer();await pc.setLocalDescription(a);socket.emit('answer-call',{to:incFrom,answer:a});showCall(isVideo,document.getElementById('incName').textContent);}catch(e){alert(e.message);}}
function reject(){document.getElementById('incomingModal').style.display='none';socket.emit('end-call',{to:incFrom});}
socket.on('call-answered',async d=>{await pc.setRemoteDescription(new RTCSessionDescription(d.answer));document.getElementById('callStat').textContent='Imeunganishwa';});
socket.on('ice-candidate',async c=>{try{await pc.addIceCandidate(new RTCIceCandidate(c));}catch{}});
socket.on('call-ended',()=>cleanup());
function toggleMute(){if(!localStream)return;let at=localStream.getAudioTracks()[0];at.enabled=!at.enabled;document.getElementById('muteBtn').textContent=at.enabled?'🎤':'🔇';}
async function switchCam(){if(!isVideo)return;curCam=curCam==="user"?"environment":"user";if(localStream)localStream.getVideoTracks().forEach(t=>t.stop());try{let ns=await getMedia(true);let nt=ns.getVideoTracks()[0];let s=pc.getSenders().find(x=>x.track&&x.track.kind==='video');if(s)s.replaceTrack(nt);document.getElementById('localVideo').srcObject=ns;if(localStream){localStream.getVideoTracks().forEach(t=>localStream.removeTrack(t));localStream.addTrack(nt);} }catch(e){}}
function end(){if(callWith)socket.emit('end-call',{to:callWith});cleanup();}
function cleanup(){clearInterval(tInt);document.getElementById('callScreen').style.display='none';document.getElementById('incomingModal').style.display='none';if(localStream)localStream.getTracks().forEach(t=>t.stop());if(pc)pc.close();pc=null;localStream=null;callWith=null;document.getElementById('remoteVideo').srcObject=null;document.getElementById('localVideo').srcObject=null;}
</script></body></html>
